name: Quero Educação
description: >-
  Quero Educação is a Brazilian education-technology company that operates a
  marketplace connecting students with higher-education institutions across
  Brazil. Its flagship product Quero Bolsa lets students compare colleges,
  courses and schools with price transparency and enroll online at discounted
  tuition, while a suite of institution-facing products — Nota Quero (online
  entrance exams), Matrícula Digital (digital enrollment), Quero Pago (tuition
  payments) and Quero Analytics (data intelligence) — helps partner schools
  fill seats and manage admissions. The company is a 500 Global portfolio
  company. It maintains a private GitHub organization and a public engineering
  blog on Medium, but exposes no public developer API, developer portal, or
  published API documentation at this time; this profile captures its public
  identity, domain-security posture, and commercial/legal surfaces.
